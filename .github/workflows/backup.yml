name: Nightly encrypted database backup

# Dumps the Supabase database, encrypts it with a PUBLIC age key (only the
# owner's offline private key can decrypt), proves the dump restores into a throwaway
# Supabase-flavoured Postgres, and stores the encrypted file as a workflow
# artifact for 30 days. Any failure fails the run, and GitHub emails the repo
# owner. Procedure, drills and recovery steps: docs/RUNBOOK.md.
#
# Notes
#  - Scheduled workflows run from the default branch only, so this does nothing
#    until it is merged to main.
#  - GitHub pauses scheduled workflows after 60 days without repository
#    activity. If backups stop appearing, that is the first thing to check.
#  - Deliberately no pull_request trigger: this job holds a database credential.

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily (about 3am US Eastern), off the :00 rush
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (tags can be moved). Both are GitHub's
      # own actions; SHAs for the v4 tags as of 2026-09-21.
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's package mirror can fail to resolve for a minute (this failed
      # the 2026-11-11 run, a DNS error, and the next night's run passed), so
      # retry with a growing pause before giving up. Still fails the run if all
      # attempts fail, so a real outage is not hidden.
      - name: Install age
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=3 update -qq \
              && sudo apt-get -o Acquire::Retries=3 install -y -qq age; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} of 4 failed"
            [ "${attempt}" -lt 4 ] && sleep $((attempt * 20))
          done
          echo "::error::could not install age after 4 attempts"
          exit 1

      - name: Dump, encrypt, then restore-test
        env:
          # Session-pooler URL (port 5432): the db.<ref>.supabase.co host is
          # IPv6-only and unreachable from GitHub runners.
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          # A PUBLIC key ("age1..."), safe to store as a plain repo variable.
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
          BACKUP_OUT: ${{ runner.temp }}/backup-out
        run: bash scripts/backup/run.sh

      # Only ever the encrypted file. `always()` so that a failed restore test
      # (which exits non-zero AFTER encrypting) still keeps that night's copy.
      - name: Upload encrypted backup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-out/*.tar.age
          if-no-files-found: error
          retention-days: 30
